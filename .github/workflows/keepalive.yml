# กันโปรเจกต์ Supabase ถูกพัก (แผนฟรีพักเมื่อไม่มีการเรียกใช้ราว 7 วัน)
# ยิงเรียก REST ของโปรเจกต์ทุก 2 วัน + เขียนเวลาลงไฟล์ .keepalive
# ไฟล์ที่เขียนทำให้ repo มีความเคลื่อนไหว GitHub จึงไม่ปิด schedule (ปิดเมื่อ repo นิ่ง 60 วัน)
#
# ต้องตั้งค่าใน repo: Settings → Secrets and variables → Actions
#   SUPABASE_URL  = Project URL (ค่าเดียวกับ url ใน config.js)
#   SUPABASE_KEY  = Publishable / anon key (ค่าเดียวกับ key ใน config.js)
name: keepalive

on:
  schedule:
    - cron: '0 3 */2 * *'   # ทุก 2 วัน เวลา 03:00 UTC (10:00 ไทย)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ping supabase
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          code=$(curl -s -o /tmp/out.txt -w '%{http_code}' --max-time 30 \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/am_config?select=id&limit=1")
          echo "HTTP $code"
          # 200 = อ่านได้ · 401/403/404 = RLS ปิดกั้นแต่คำขอถึงฐานข้อมูลแล้ว ถือว่ามีการใช้งาน
          case "$code" in 200|401|403|404) exit 0 ;; *) echo "ping ไม่สำเร็จ"; exit 1 ;; esac

      - name: บันทึกเวลาที่ยิงล่าสุด
        run: |
          date -u '+%Y-%m-%d %H:%M UTC' > .keepalive
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add .keepalive
          git diff --staged --quiet || git commit -m "keepalive $(cat .keepalive)"
          git push
